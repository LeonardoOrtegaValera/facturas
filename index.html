<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- El titulo de abajo lo rellena Expo con el nombre que esta en
         app.json, para que el nombre viva en un solo lugar.
         OJO: no escribir la marca de reemplazo dentro de un comentario.
         Expo solo cambia la PRIMERA que encuentra, y si esta en un
         comentario, el titulo de verdad se queda sin reemplazar. -->
    <title>Control de Facturas</title>

    <!-- viewport-fit=cover: sin esto, en iPhone con notch queda una
         franja blanca arriba y abajo cuando la app esta instalada. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    />

    <!-- Estas cuatro lineas son las que hacen que al darle
         "Agregar a pantalla de inicio" quede como una app de verdad,
         a pantalla completa y sin la barra de Safari. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Facturas" />

    <!-- theme-color y description los inyecta Expo solo, leyendolos de
         app.json. Si se ponen aqui tambien, salen duplicados. -->

    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" href="favicon.png" />

    <style>
      /* Mismos colores del tema Arena & grafito, para que el arranque
         no destelle en blanco antes de que cargue la app. */
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #F6F3EE;
      }
      body {
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Deja respirar el notch y la barra de gestos del iPhone. */
      @supports (padding: env(safe-area-inset-top)) {
        #root {
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }
      /* Pantalla de carga: se tapa sola cuando la app se dibuja encima. */
      #cargando {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F6F3EE;
        color: #7A7168;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
      }
    </style>
  <meta name="theme-color" content="#2B2722">
<meta name="description" content="Fotografía tus facturas de obra y arma el reporte para tu contador.">
<link rel="icon" href="/favicon.ico" /></head>

  <body>
    <div id="root"></div>
    <div id="cargando">Abriendo…</div>
    <script>
      // Quita el "Abriendo…" apenas la app pinta algo dentro de #root.
      var raiz = document.getElementById("root");
      var obs = new MutationObserver(function () {
        if (raiz.childNodes.length) {
          var c = document.getElementById("cargando");
          if (c && c.parentNode) c.parentNode.removeChild(c);
          obs.disconnect();
        }
      });
      obs.observe(raiz, { childList: true });
      setTimeout(function () {
        var c = document.getElementById("cargando");
        if (c && c.parentNode) c.parentNode.removeChild(c);
      }, 15000);
    </script>
  <script src="/_expo/static/js/web/index-61bc4c4c891f9902a470af518f9fce98.js" defer></script>
</body>
</html>
